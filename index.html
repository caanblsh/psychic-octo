<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة ترحيبية</title>
    <style>


        /* إخفاء المحتوى تماماً عند محاولة طباعة الصفحة أو تصويرها */
        @media print {
            body {
                display: none !important;
            }
        }
        
        /* تأثير الضباب (Blur) لحماية الشاشة عند التنقل بين التطبيقات في الجوال */
        .blurred {
            filter: blur(15px);
            user-select: none;
        }













        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #00d2ff;
            background: linear-gradient(to right, #00d2ff, #92fe9d);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.4);
        }

        .welcome-card h1 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .welcome-card p {
            font-size: 16px;
            color: #e0e0e0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-action {
            display: inline-block;
            padding: 12px 35px;
            background: #ffffff;
            color: #203a43;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-action:hover {
            background: #00d2ff;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="icon-box">✨</div>
        <h1>مرحباً بك في منصتنا</h1>
        <p>اكتشف تجربة مستخدم فريدة وعصرية مصممة خصيصاً لتلبية احتياجاتك بكل سهولة وسلاسة.</p>
        <a href="#" class="btn-action">ابدأ الآن</a>
    </div>











































    <script>
        const content = document.getElementById('content');

        // 1. تشويش الشاشة إذا تشتت انتباه المستخدم (عند فتح قائمة المهام في الجوال مثلاً)
        window.addEventListener('blur', () => {
            content.classList.add('blurred');
        });

        // إزالة التشويش عند العودة للموقع
        window.addEventListener('focus', () => {
            content.classList.remove('blurred');
        });

        // 2. منع زر الفأرة الأيمن (لمنع فحص العناصر وحفظ الصور)
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // 3. منع أزرار اختصارات لقطة الشاشة والـ DevTools في اللابتوب
        document.addEventListener('keydown', (e) => {
            // منع Ctrl+P (الطباعة)
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                alert('الطباعة غير مسموحة!');
            }
            // منع F12 و Ctrl+Shift+I (فحص العناصر)
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
            // منع أزرار تصوير الشاشة المشهورة (مثل Print Screen)
            if (e.key === 'PrintScreen') {
                navigator.clipboard.writeText(''); // تفريغ الحافظة فوراً
                alert('تنبيه: تصوير الشاشة ممنوع!');
            }
        });
    </script>


</body>
</html>

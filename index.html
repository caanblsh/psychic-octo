<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة ترحيبية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: #00d2ff;
            background: linear-gradient(to right, #00d2ff, #92fe9d);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.4);
        }

        .welcome-card h1 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .welcome-card p {
            font-size: 16px;
            color: #e0e0e0;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-action {
            display: inline-block;
            padding: 12px 35px;
            background: #ffffff;
            color: #203a43;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-action:hover {
            background: #00d2ff;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="icon-box">✨</div>
        <h1>مرحباً بك في منصتنا</h1>
        <p>اكتشف تجربة مستخدم فريدة وعصرية مصممة خصيصاً لتلبية احتياجاتك بكل سهولة وسلاسة.</p>
        <a href="#" class="btn-action">ابدأ الآن</a>
    </div>



























<!-- 1. تنسيقات CSS لحظر التحديد وسحب الصور وتأثير حجب اللقطات والرسالة -->
<style>
  /* منع تحديد النصوص وسحب الصور */
  body {
    -webkit-user-select: none; /* Safari */
    -moz-user-select: none;    /* Firefox */
    -ms-user-select: none;     /* IE10+ */
    user-select: none;         /* Standard */
  }
  img {
    -webkit-user-drag: none;   /* منع سحب الصور */
    user-drag: none;
  }

  /* تأثير التمويه عند خروج الهاتف عن التركيز لتشتيت لقطات الشاشة */
  .blur-screen {
    filter: blur(25px) !important;
    background: #000 !important;
    opacity: 0 !important;
    transition: opacity 0.2s ease;
  }

  /* تنسيق رسالة التحذير العائمة (Toast) */
  #custom-alert {
    visibility: hidden;
    min-width: 280px;
    background-color: #e74c3c; /* لون أحمر تحذيري */
    color: #fff;
    text-align: center;
    border-radius: 8px;
    padding: 16px;
    position: fixed;
    z-index: 99999;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: bold;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
    direction: rtl;
  }
  #custom-alert.show {
    visibility: visible;
    animation: fadein 0.4s, fadeout 0.4s 2.6s;
  }
  @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
  @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
</style>

<!-- عنصر رسالة التحذير -->
<div id="custom-alert">عذراً، نسخ المحتوى أو استخدام أدوات الفحص غير مسموح به!</div>

<!-- 2. سكربت الحماية الشامل JavaScript -->
<script>
  // دالة مخصصة لإظهار رسالة التحذير العائمة
  function showWarning() {
    var alertBox = document.getElementById("custom-alert");
    if (!alertBox.classList.contains("show")) {
      alertBox.classList.add("show");
      setTimeout(function() { 
        alertBox.classList.remove("show"); 
      }, 3000);
    }
  }

  // أ. تعطيل القائمة اليمنى وإظهار التحذير
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    showWarning();
  });

  // ب. حظر الأزرار والاختصارات البرمجية
  document.addEventListener('keydown', function(e) {
    // حظر زر F12
    if (e.key === 'F12') {
      e.preventDefault();
      showWarning();
      return false;
    }

    // حظر Ctrl+Shift+I (أدوات المطور)
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
      e.preventDefault();
      showWarning();
      return false;
    }

    // حظر Ctrl+Shift+C (عنصر الفحص)
    if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
      e.preventDefault();
      showWarning();
      return false;
    }

    // حظر Ctrl+U (عرض السورس كود)
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
      e.preventDefault();
      showWarning();
      return false;
    }
    
    // حظر Ctrl+S (حفظ الصفحة)
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      showWarning();
      return false;
    }
  });

  // ج. منع سحب وإفلات العناصر والصور
  document.addEventListener('dragstart', function(e) {
    e.preventDefault();
  });

  // د. حماية لقطات الشاشة للهواتف عبر التمويه عند فقدان التركيز
  window.addEventListener('blur', function() {
    document.body.classList.add('blur-screen');
  });
  window.addEventListener('focus', function() {
    document.body.classList.remove('blur-screen');
  });

  // هـ. فحص وإغلاق الصفحة تلقائياً في حال فتح أدوات المطور بطرق ملتوية
  (function() {
    const threshold = 160; 
    function detectDevTools() {
      const widthCheck = window.outerWidth - window.innerWidth > threshold;
      const heightCheck = window.outerHeight - window.innerHeight > threshold;
      
      if (widthCheck || heightCheck) {
        window.location.href = "about:blank"; // توجيه لصفحة فارغة فوراً
      }
    }
    setInterval(detectDevTools, 1000);
    window.addEventListener('resize', detectDevTools);
  })();
</script>


</body>
</html>
